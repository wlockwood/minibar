[package]
name = "visigoth-simulator"
version = "0.1.0"
edition = "2024"
description = "Fast approximate tactical simulator for Beyond All Reason experiments"

[dependencies]
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[profile.release]
lto = "thin"
codegen-units = 1
