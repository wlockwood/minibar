<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Progress</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10); --neutral: #f0efec;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --good-text: #006300;
  --pole-pos: #2a78d6; --pole-neg: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10); --neutral: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --good-text: #0ca30c; --pole-pos: #3987e5; --pole-neg: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10); --neutral: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --good-text: #0ca30c; --pole-pos: #3987e5; --pole-neg: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1320px; margin: 0 auto; padding: 16px; }
header.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
.sub { color: var(--ink2); font-size: 13px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--axis); font-size: 12px; color: var(--ink2); }
.pill.live::before { content: "● "; color: var(--good); }
button, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover, select:hover { background: var(--neutral); }
button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
.row label { color: var(--ink2); font-size: 13px; }
.verdict { border: 1px solid var(--ring); background: var(--surface); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; border-left-width: 5px; }
.verdict.progress { border-left-color: var(--good); } .verdict.early, .verdict.waiting { border-left-color: var(--muted); }
.verdict.flat, .verdict.stalled, .verdict.mixed { border-left-color: var(--warn); } .verdict.regress { border-left-color: var(--crit); }
.verdict b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); margin-bottom: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 10px 12px; min-height: 104px; }
.tile .label { color: var(--ink2); font-size: 12px; }
.tile .value { font-size: 28px; font-weight: 600; line-height: 1.15; margin: 2px 0; }
.tile .delta { font-size: 12px; color: var(--ink2); }
.delta .up { color: var(--good-text); } .delta .down { color: var(--crit); }
.tile svg { display: block; margin-top: 4px; }
.meter { height: 8px; border-radius: 4px; background: var(--grid); margin-top: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
.card p.note { margin: 0 0 8px; color: var(--ink2); font-size: 12.5px; }
.card.wide { grid-column: 1 / -1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink2); margin: 2px 0 4px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--c, var(--ink)); vertical-align: middle; margin-right: 5px; }
.legend span.box::before { width: 10px; height: 10px; border: 0; background: var(--c); border-radius: 2px; vertical-align: -1px; }
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; }
.axis-text { fill: var(--muted); font-size: 11px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
details { margin-top: 6px; } summary { cursor: pointer; color: var(--ink2); font-size: 12.5px; }
table.data { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); }
table.data th:first-child, table.data td:first-child { text-align: left; }
.scroll { overflow-x: auto; max-height: 320px; overflow-y: auto; }
.heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; width: 100%; }
.heat th { font-weight: 500; color: var(--ink2); text-align: center; padding: 2px 4px; }
.heat th.rowh { text-align: left; max-width: 220px; }
.heat td { text-align: center; padding: 6px 4px; border-radius: 4px; min-width: 64px; font-variant-numeric: tabular-nums; }
.heat-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.heat-pair h3 { font-size: 12.5px; margin: 0 0 2px; font-weight: 600; color: var(--ink2); }
.events { list-style: none; margin: 0; padding: 0; max-height: 330px; overflow: auto; }
.events li { display: grid; grid-template-columns: 52px 22px 1fr; gap: 4px; padding: 4px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.events .gen { color: var(--muted); font-variant-numeric: tabular-nums; }
.events .ic.good { color: var(--good-text); } .events .ic.warn { color: var(--serious); } .events .ic.info { color: var(--ink2); }
.bar { display: grid; grid-template-columns: 110px 1fr 150px; gap: 8px; align-items: center; font-size: 12.5px; margin: 3px 0; }
.bar .track { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--s1); border-radius: 5px; }
.bar .fill.flat { background: var(--serious); }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--axis);
  border-radius: 8px; padding: 6px 9px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; max-width: 320px; }
.tip-title { color: var(--ink2); margin-bottom: 3px; }
.tip-row { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.tip-row i { display: inline-block; width: 12px; border-top: 2px solid var(--c); }
.tip-row b { font-weight: 600; } .tip-row span { color: var(--ink2); }
footer { color: var(--muted); font-size: 12px; margin: 16px 0 4px; }
@media (max-width: 560px) { .bar { grid-template-columns: 80px 1fr 120px; } .tile .value { font-size: 24px; } }
.network-scroll { overflow:auto; max-height:560px; border:1px solid var(--ring); border-radius:6px; margin:8px 0; }
.network-scroll svg { display:block; }
.matchup-card { border:1px solid var(--grid); border-radius:8px; padding:10px 12px; margin:10px 0; }
.matchup-card h4 { margin:0 0 6px; }
.matchup-armies { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; }
.matchup-armies p { margin:0; }
.matchup-facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:4px 16px; margin-top:8px; font-size:12.5px; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1 id="title">Training progress</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="row" style="margin:0">
      <span class="pill" id="status"></span>
      <span class="sub" id="generated"></span>
      <button id="theme" title="Switch between light and dark">Theme</button>
    </div>
  </header>
  <div class="row" id="tabs" role="tablist" aria-label="Track"></div>
  <div id="view"></div>
  <footer id="foot"></footer>
</main>
<div class="tip" id="tip"></div>
<pre id="err" hidden></pre>
<script>
// Its own block, so a syntax error in the main script below is still reported on the page.
window.addEventListener('error', e => { const p = document.getElementById('err'); p.hidden = false; p.textContent += (e.message || e) + ' @' + e.lineno + '\n'; });
</script>
<script>

function luminance(hex) {

  const c = [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function mix(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const SEQ = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'];
function isDark() { return luminance(cssVar('--surface')) < 0.2; }
function seqColor(t) {
  t = Math.min(1, Math.max(0, t));
  if (isDark()) t = 1 - t;   // on a dark surface "more" is brighter and "less" recedes into the background
  const k = t * (SEQ.length - 1), i = Math.min(SEQ.length - 2, Math.floor(k));
  return mix(SEQ[i], SEQ[i + 1], k - i);
}
function divColor(t) {  // t in [-1, 1]; gray midpoint, blue = better, red = worse
  t = Math.min(1, Math.max(-1, t));
  return t >= 0 ? mix(cssVar('--neutral'), cssVar('--pole-pos'), t) : mix(cssVar('--neutral'), cssVar('--pole-neg'), -t);
}
function heatmap(host, o) {
  host.replaceChildren();
  if (!o.rows.length) { host.append(h('p', { class: 'empty', text: o.empty || 'No data yet.' })); return; }
  const table = h('table', { class: 'heat' },
    h('thead', {}, h('tr', {}, h('th', {}), o.cols.map(c => h('th', { text: c })))),
    h('tbody', {}, o.rows.map(r => h('tr', {}, h('th', { class: 'rowh', text: r }), o.cols.map(c => {
      const cell = o.cell(r, c);
      if (!cell) return h('td', { text: '–', style: 'color:var(--muted)' });
      const bg = cell.bg;
      const td = h('td', { text: cell.text, style: `background:${bg};color:${luminance(bg) > 0.4 ? '#0b0b0b' : '#ffffff'}`, tabindex: 0, 'aria-label': r + ', ' + c + ': ' + cell.tip.join('; ') });
      td.addEventListener('pointermove', evt => showTip(evt, r + ' vs ' + c, cell.tip.map(t => ({ value: t, label: '' }))));
      td.addEventListener('pointerleave', hideTip);
      return td;
    })))));
  host.append(table);
}

function sparkline(values, color) {
  const pts = values.filter(v => v != null && isFinite(v));
  if (pts.length < 2) return null;
  const W = 150, H = 28, lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
  const xy = pts.map((v, i) => [2 + i / (pts.length - 1) * (W - 4), H - 4 - (v - lo) / span * (H - 8)]);
  return sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' },
    sv('polyline', { points: xy.map(p => p.join(',')).join(' '), fill: 'none', stroke: cssVar(color), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }),
    sv('circle', { cx: xy[xy.length - 1][0], cy: xy[xy.length - 1][1], r: 4, fill: cssVar(color), stroke: cssVar('--surface'), 'stroke-width': 2 }));
}
function tableView(headers, rows, open = false) {
  return h('details', {open}, h('summary', { text: 'Table view' }),
    h('div', { class: 'scroll' }, h('table', { class: 'data' }, h('thead', {}, h('tr', {}, headers.map(x => h('th', { text: x })))),
      h('tbody', {}, rows.map(r => h('tr', {}, r.map(c => h('td', { text: c }))))))));
}
const legend = items => h('div', { class: 'legend' }, items.map(i => h('span', { class: i.box ? 'box' : '', style: '--c:' + (cssVar(i.color) || i.color), text: i.label })));

// ---------------------------------------------------------------- data derivation
const OUTCOME = [
  { key: 'wins', label: '✓ win', color: '--good' }, { key: 'draws', label: '= draw', color: '--muted' },
  { key: 'timeouts', label: '◷ timeout', color: '--warn' }, { key: 'losses', label: '✕ loss', color: '--crit' },
];
const ISLAND_COLORS = ['--s1', '--s2', '--s3'];
const STAGE_COLORS = ['--s3', '--s4', '--s5'];
const state = { track: 0, island: null, kind: 'center' };
const valOf = i => i && (state.kind === 'sample' ? i.sample : i.center);
const candidateLabel = () => `${state.island || 'selected branch'} ${state.kind === 'sample' ? 'best sample' : 'center'}`;

function islandNames(t) { return [...new Set(t.generations.flatMap(g => g.islands.map(i => i.name)))]; }
function islandAt(g, name) { return g.islands.find(i => i.name === name); }
function winRate(o) { return o && o.battles ? o.wins / o.battles : null; }
function rowKey(stage, r) { return stage + '|' + r.scenario + '|' + r.opponent; }
function collectRows(report) {
  const map = new Map();
  for (const st of (report && report.stages) || []) for (const r of st.rows || []) map.set(rowKey(st.name, r), { stage: st.name, ...r });
  return map;
}
function trialGroups(report) {
  const map = new Map();
  for (const t of (report && report.trials) || []) {
    const k = t.faction + '|' + t.map; const e = map.get(k) || { faction: t.faction, map: t.map, f: 0, n: 0 };
    e.f += t.fitness || 0; e.n += 1; map.set(k, e);
  }
  return map;
}

// ---------------------------------------------------------------- view
function renderTiles(t) {
  const gens = t.generations, last = gens[gens.length - 1];
  const done = gens.length ? last.generation : 0, target = D.meta.target_generations;
  const tiles = [];
  tiles.push(h('div', { class: 'tile' }, h('div', { class: 'label', text: 'Generation' }),
    h('div', { class: 'value', text: target ? `${done} / ${target}` : String(done) }),
    h('div', { class: 'delta', text: D.meta.status + (D.meta.waiting_jobs ? ` · ${D.meta.waiting_jobs} jobs waiting` : '') }),
    target ? h('div', { class: 'meter' }, h('i', { style: `width:${Math.min(100, done / target * 100)}%` })) : null));
  const init = t.initial && t.initial.fitness, best = t.best && t.best.fitness;
  const champ = gens.map(g => g.champion_fitness);
  tiles.push(h('div', { class: 'tile' }, h('div', { class: 'label', text: 'Champion validation fitness' }),
    h('div', { class: 'value', text: f3(best) }),
    h('div', { class: 'delta' }, 'vs start ', h('span', { class: best > init ? 'up' : best < init ? 'down' : '', text: sgn(best - init) })),
    sparkline([init].concat(champ), '--s1')));
  if (t.kind === 'tactical') {
    const wi = winRate(t.initial && t.initial.outcome), wb = winRate(t.best && t.best.outcome), ob = t.best && t.best.outcome;
    const ci = ob ? wilson(ob.wins, ob.battles) : [0, 1];
    tiles.push(h('div', { class: 'tile' }, h('div', { class: 'label', text: 'Win rate (champion, validation)' }),
      h('div', { class: 'value', text: pct(wb) }),
      h('div', { class: 'delta' }, 'vs start ', h('span', { class: wb > wi ? 'up' : wb < wi ? 'down' : '', text: pp(wb - wi) })),
      h('div', { class: 'delta', text: ob ? `${ob.wins}/${ob.battles} battles · 95% range ${pct(ci[0])}–${pct(ci[1])}` : '' })));
  } else {
    const tb = t.best && t.best.trial_means, ti = t.initial && t.initial.trial_means;
    tiles.push(h('div', { class: 'tile' }, h('div', { class: 'label', text: 'Projects completed per game (champion)' }),
      h('div', { class: 'value', text: tb ? num(tb.projects_completed) : '–' }),
      h('div', { class: 'delta', text: ti && tb ? `start ${num(ti.projects_completed)} · units ${num(ti.units_produced)} → ${num(tb.units_produced)}` : '' }),
      h('div', { class: 'delta', text: tb ? `rejected build orders: ${num(tb.rejected_total)} (start ${ti ? num(ti.rejected_total) : '–'})` : '' })));
  }
  const ho = t.holdout && t.holdout.fitness, hi = t.holdout_initial && t.holdout_initial.fitness;
  tiles.push(h('div', { class: 'tile' }, h('div', { class: 'label', text: 'Separate test fitness (holdout)' }),
    h('div', { class: 'value', text: f3(ho) }),
    h('div', { class: 'delta' }, hi == null ? 'no starting score recorded' : ['vs start ', h('span', { class: ho > hi ? 'up' : ho < hi ? 'down' : '', text: sgn(ho - hi) })]),
    h('div', { class: 'delta', text: 'never used to pick champions' })));
  tiles.push(h('div', { class: 'tile' }, h('div', { class: 'label', text: 'Diagnostic frontier' }), h('div', { class: 'value', text: String(t.diagnostic_challengers || 0) }), h('div',{class:'delta',text:'Separate optional frontier; this does not count saved candidate files or the elite retest pool.'})));
  const since = gens.length ? last.generation - (t.best_generation || 0) : 0;
  tiles.push(h('div', { class: 'tile' }, h('div', { class: 'label', text: 'Last new champion' }),
    h('div', { class: 'value', text: t.best_generation ? 'gen ' + t.best_generation : 'none yet' }),
    h('div', { class: 'delta', text: gens.length ? (since === 0 ? 'this generation' : since + (since === 1 ? ' generation ago' : ' generations ago')) : '' }),
    h('div', { class: 'delta', text: (t.islands_now || []).map(i => `${i.name}: ${i.restarts || 0} restarts`).join(' · ') })));
  const norms = gens.map(g => { const i = g.islands[0]; return i && i.update_norm; });
  tiles.push(h('div', { class: 'tile' }, h('div', { class: 'label', text: 'Search step size (update norm)' }),
    h('div', { class: 'value', text: gens.length && last.islands[0] ? f3(last.islands[0].update_norm) : '–' }),
    h('div', { class: 'delta', text: 'first branch’s weight update; zero means no change this round. Larger is not necessarily better.' }), sparkline(norms, '--s2')));
  return h('div', { class: 'tiles' }, tiles);
}

function card(title, note, ...body) { return h('section', { class: 'card' }, h('h2', { text: title }), note ? h('p', { class: 'note', text: note }) : null, ...body); }

function chartCoverage(t) {
  const domain = {ground:'Ground brain', air:'Air brain', strategic:'Strategic brain', unknown:'Brain domain unavailable'}[t.brain_domain || 'unknown'];
  const el = card('Validation fight coverage',
    `${domain}. These are validation fights used to compare candidates and select champions, not training or holdout fights. A fight family is a matchup category, such as a heavy unit against a swarm. Investment = metal + energy / 60. Counts are distinct recorded cases including opponent and side, not wins. Family fitness uses the native report's pooled score when available; older wrappers average opponent rosters equally.`);
  el.classList.add('wide');
  const latest = t.generations[t.generations.length - 1];
  const island = latest && islandAt(latest, state.island);
  const choices = [['champion', 'Current champion', t.best], ['initial', 'Starting brain', t.initial],
    ['candidate', 'Latest selected candidate', island && island[state.kind]]].filter(c => c[2]);
  let selected = choices.length ? choices[0][0] : null;
  const body = h('div');
  const draw = () => {
    body.replaceChildren();
    const report = (choices.find(c => c[0] === selected) || [])[2];
    const stages = (report && report.stages) || [];
    const covered = stages.filter(s => Object.keys(s.coverage || {}).length || Object.keys(s.family_fitness || {}).length);
    if (!covered.length) {
      body.append(h('p', {class:'empty', text:'No family or resource records in this report. Older campaigns do not record this coverage.'}));
      return;
    }
    for (const stage of covered) {
      body.append(h('h3', {text:stage.name || 'Evaluation'}));
      const sensors = stage.sensor_support_coverage;
      if (sensors) body.append(h('p',{class:'sub',text:`Assigned reconnaissance support · neither side: ${sensors.none} · one side: ${sensors.one} · both sides: ${sensors.both} (${((sensors.one+sensors.both)/sensors.recorded*100).toFixed(0)}% with radar support). Counts are recorded cases. Providers are destructible; actual detection depends on range, terrain, jamming and scout survival.`}));

      const families = [...new Set([...Object.keys(stage.coverage || {}), ...Object.keys(stage.family_fitness || {})])].sort();
      body.append(tableView(['Fight family', 'Recorded cases', 'Family fitness'], families.map(f =>
        [f.replaceAll('_', ' '), (stage.coverage || {})[f] ?? '–', f3((stage.family_fitness || {})[f])]), true));
      const records = stage.matchup_records || [];
      if (!records.length) {
        body.append(h('p', {class:'sub', text:'Composition records are unavailable for this saved candidate summary.'}));
        continue;
      }
      const army = roster => (roster || []).map(u => `${u.count} × ${u.name || u.unit}`).join(', ') || 'None';
      const investment = value => value == null || !isFinite(value) ? '–' : (Number(value) || 0).toLocaleString('en-US', {maximumFractionDigits:2});
      const cards = records.map(r => {
        const s = r.scenario || {};
        const valueRows = [['Requested budget',r.requested_budget],['Combat investment',r.combat_value],
          ['Objective assets',r.objective_value],['Radar / scout / jammer support',r.sensor_support_value],['Starting investment',r.starting_value]];
        const values = h('table',{class:'data'},
          h('thead',{},h('tr',{},['Investment measure','Learner','Enemy'].map(text=>h('th',{text})))),
          h('tbody',{},valueRows.map(([label,v])=>h('tr',{},h('td',{text:label}),
            h('td',{text:investment(v?.[0])}),h('td',{text:investment(v?.[1])})))));
        const supply = r.resource_supply === null ? 'Unlimited firing resources' : r.resource_supply
          ? `${num(r.resource_supply.metal)} metal, ${num(r.resource_supply.energy)} energy per side` : 'Unavailable';
        const supportText = side => side ? [['Radar',side.radar],['air scout',side.air_scout],['jammer',side.jammer]].filter(([,name])=>name).map(([role,name])=>`${role}: ${name}`).join(' · ') || 'None assigned' : 'Not recorded';
        return h('article',{class:'matchup-card'},h('h4',{text:s.name || 'Unnamed fight'}),
          h('div',{class:'matchup-armies'},h('p',{},h('b',{text:'Learner army: '}),army(s.learner)),
            h('p',{},h('b',{text:'Enemy army: '}),army(s.enemy))),values,
          h('div',{class:'matchup-facts'},
            h('span',{text:`Combat gap: ${r.absolute_gap == null ? '–' : (r.absolute_gap*100).toFixed(2)+'%'} · ${r.balance_class || 'unclassified'}`}),
            h('span',{text:`Signed combat ratio: ${r.signed_ratio == null ? '–' : (r.signed_ratio*100).toFixed(2)+'%'}`}),
            h('span',{text:`Opponent: ${r.opponent_identity || 'Unavailable'}`}),
            h('span',{text:`Learner support: ${supportText(r.sensor_support?.[0])}`}),
            h('span',{text:`Enemy support: ${supportText(r.sensor_support?.[1])}`}),
            r.sensor_support && r.starting_value ? h('span',{text:`Total investment gap (includes support and objectives): ${(Math.abs(r.starting_value[0]-r.starting_value[1])/Math.max((r.starting_value[0]+r.starting_value[1])/2,1e-9)*100).toFixed(2)}% · all asset costs count in scoring`}) : null,

            h('span',{text:r.starting_distance
              ? `Starting front gap: ${investment(r.starting_distance.sampled)} world units · interval ${r.starting_distance.bounds.map(investment).join('–')} · ${r.starting_distance.mode}`
              : `Starting front gap: ${investment(s.separation)} world units · derivation unavailable`}),
            r.starting_distance?.mode === 'unit_ranges' ? h('span',{text:`Largest LOS: ${investment(r.starting_distance.max_los)} · longest weapon: ${investment(r.starting_distance.max_weapon_range)} · air runway floor: ${investment(r.starting_distance.air_runway_floor)}`}) : null,
            r.starting_distance?.mode === 'unit_ranges' ? h('span',{text:`Approach allowance: ${investment(r.starting_distance.approach_time)} seconds${r.starting_distance.approach_time_capped ? ' (capped)' : ''} · combat budget: ${investment(stage.combat_budget)} seconds${r.starting_distance.contact_unreachable ? ' · no mobile unit can close the unseen gap' : ''}`}) : null,

            h('span',{text:`Objective: ${s.objective ? s.objective.kind+': '+s.objective.target : 'Skirmish'}`})));

      body.append(h('details', {}, h('summary', {text:stage.matchup_records_sampled
        ? `Inspect ${records.length} saved examples of compositions and resource totals`

        stage.matchup_records_sampled ? h('p',{class:'sub',text:'History keeps at most two example fights per stage. Family counts above include the full evaluated roster; these examples do not represent its distribution. Complete reports remain in the candidate receipts and work results.'}) : null,
        h('p', {class:'sub', text:'Learner = the selected brain; enemy = its opponent. Requested budget is the packing target for combat units. Actual combat investment + objective assets = starting investment. Integer unit counts can leave a gap from the target. Combat gap and signed ratio compare combat investment; signed ratio = enemy / learner − 1, so positive means the learner has less. Modeled mechanics support describes simulator capability; firing resource supply separately describes metal and energy available for firing weapons. Recorded side is metadata; evaluation may also mirror it.'}),cards));
    }

    choices.map(([value, text]) => h('option', {value, text})))));
  el.append(body);
  return {el, draw};
}

function chartElites(t) {
  const pretty = value => String(value).replaceAll('_', ' ');
  const cadence = D.meta.elite_retest_every || 0;
  const el = card('Saved elites · automatic retests', cadence
    ? `Keeps up to ${D.meta.elite_size || 8} promising brains per track. One saved elite challenges the current champion every ${cadence} generations, using fresh paired fights and the normal promotion checks. A big gain can be retained even when a protected matchup vetoes promotion. The holdout is excluded.`
    : 'Automatic elite retests are disabled in this run. Evaluated candidate files are still saved separately.');
  const pool = t.elite_pool || [], last = t.last_elite_retest;
  if (last) el.append(h('p',{text:`Last elite retest: generation ${last.generation} · ${last.brain_sha256?.slice(0,12) || 'unknown'} · ${pretty(last.reason || 'unknown')}${last.paired_gain == null ? '' : ' · paired gain '+sgn(last.paired_gain)}`}));
  if (!pool.length) el.append(h('p',{class:'empty',text:cadence ? 'No elite candidates retained yet.' : 'Start a newly prepared campaign with elite retests enabled to use this pool.'}));
  else el.append(tableView(['Brain','Origin','Fresh observations','Mean fresh gain vs then-champion','Last retest','Latest decision'],pool.map(e=>[
    e.brain_sha256.slice(0,12),e.origin?.import_index != null ? `Imported ${e.origin.import_index+1}` : `Gen ${e.origin?.generation ?? '?'} · ${e.origin?.island || '?'} · ${e.origin?.candidate || '?'}`,
    e.observations || 0,e.observations ? sgn(e.mean_gain) : 'Awaiting fresh test', e.last_retested ?? 'Not yet',pretty(e.last_reason || 'unknown'),
  ]),true));
  return {el,draw(){}};
}

function chartFiring(t) {
  const el = card('Are units able to fire?', 'Champion validation, by fight family. Participation counts armed units that fired at least once in each battle; repeated battles count the same unit again. Blocked percentages count aimed, ready weapon checks each simulation tick, so sustained obstruction weighs more. These are diagnostics and do not add a training reward.');
  const rows = [];
  for (const stage of t.best?.stages || []) {
    if (!stage.firing) continue;
    stage.firing.forEach((side, index) => rows.push([
      stage.name, index === 0 ? 'Learner' : 'Opponent',
      `${num(side.units_fired)} / ${num(side.armed_units)}`, pct(side.participation_rate),
      pct(side.friendly_blocked_rate), pct(side.terrain_blocked_rate),
      pct(side.resources_blocked_rate), num(side.shots_fired),
    ]));
  }
  if (rows.length) el.append(h('div', {class:'scroll'}, tableView(
    ['Fight family', 'Army', 'Fired / armed (summed)', 'Participation', 'Ally blocked', 'Terrain blocked', 'Supply blocked', 'Weapon emissions'], rows, true)));
  else el.append(h('p', {class:'empty',text:'Firing diagnostics were not recorded for this report. New runs with the updated simulator record both armies.'}));
  return {el, draw() {}};
}

function chartRetest(t) {
  const r = t.retest;
  const el = card('Fresh-seed retest: is each brain really better than the start?',
    'Each brain is re-scored on many new, paired seed bases (the same bases for every brain) and compared with the starting brain. Difference = brain minus start; t is difference divided by its standard error, so |t| of 2 or more is a real effect and below that is noise. Training scenarios are what the optimizer fits, validation scenarios select champions, and the holdout never selects anything. Produced by scripts/fresh_retest.py.');
  const fams = r.families || [];
  const names = [...new Set(fams.flatMap(f => f.brains.map(b => b.name)))];
  const cell = row => {
    if (!row) return h('td', { text: '–' });
    const c = row.t >= 2 ? '--good' : row.t <= -2 ? '--crit' : '--muted';
    return h('td', { style: 'color:' + (cssVar(c) || c) + ';font-weight:' + (Math.abs(row.t) >= 2 ? 600 : 400), text: sgn(row.diff) + '  (t ' + (row.t >= 0 ? '+' : '−') + Math.abs(row.t).toFixed(1) + ')' });
  };
  el.append(h('div', { class: 'scroll' }, h('table', { class: 'data' },
    h('thead', {}, h('tr', {}, h('th', { text: 'brain' }), fams.map(f => h('th', { text: f.label + ' · start ' + f3(f.baseline) + ' · ' + f.n + ' seeds' })))),
    h('tbody', {}, names.map(n => h('tr', {}, h('td', { text: n === 'champion' ? 'champion' : n + ' island latest' }), fams.map(f => cell(f.brains.find(b => b.name === n)))))))));
  return { el, draw() {} };
}

function chartFitness(t) {
  const gens = t.generations, names = islandNames(t);
  const host = h('div', { class: 'chart' });
  const series = [{ id: 'champion', label: 'Champion', color: '--ink', width: 3, step: true, dots: false,
                    points: [[0, t.initial && t.initial.fitness]].filter(p => p[1] != null).concat(gens.map(g => [g.generation, g.champion_fitness])) }];
  names.forEach((n, i) => {
    series.push({ id: n + ':center', label: n + ' island, center', color: ISLAND_COLORS[i % 3],
      points: gens.filter(g => islandAt(g, n) && islandAt(g, n).center).map(g => [g.generation, islandAt(g, n).center.fitness]) });
    series.push({ id: n + ':sample', label: n + ' island, best sample', color: ISLAND_COLORS[i % 3], width: 1.5, hollow: true,
      points: gens.filter(g => islandAt(g, n) && islandAt(g, n).sample).map(g => [g.generation, islandAt(g, n).sample.fitness]) });
  });
  const baselines = t.initial ? [{ y: t.initial.fitness, label: 'starting brain' }] : [];

  select.addEventListener('change',modules);moduleSelect.addEventListener('change',draw);compare.addEventListener('change',draw);disabled.addEventListener('change',draw);
  el.append(h('h3',{text:'Transformation history'}),h('p',{class:'note',text:'Generation counts weight-training rounds. Attempt counts structural experiments within a search branch (an “island”). A recorded experiment shows its proposed structure before weight training. Accepted changes may reflect both the edit and subsequent weight training.'}));
  if(!t.structural_history_available)el.append(h('p',{text:'Structural history was not recorded for this run. Only the available starting/current brains can be shown.'}));
  else if(!events.length)el.append(h('p',{text:'No structural experiments committed yet. This may be a weight-only run or training may not have reached its first structural generation.'}));
  else {
    const outcomes={training:'Still training',evaluated_without_promotion:'Evaluated; not promoted',accepted:'Accepted as champion',superseded_without_evaluation:'Replaced by next experiment before evaluation'};
    const rows=events.map(e=>[e.generation,`${e.island} · attempt ${e.attempt}`,(e.changes||[]).map(describe).join('; ')||'Snapshot unavailable',(outcomes[e.outcome]||e.outcome)+(e.accepted_generation?' at generation '+e.accepted_generation:'')]);
    const historyTable=tableView(['Generation','Search branch','Proposed change','Outcome so far'],rows);
    historyTable.open=true;
    const historyLabel=historyTable.querySelector('summary');if(historyLabel)historyLabel.textContent='Recorded structural experiments';
    el.append(h('div',{class:'scroll'},historyTable));
  }
  modules();return {el,draw};
}

let drawers = [];
const viewStorageKey = 'minibar-dashboard-view:' + location.pathname + ':' + (D?.meta?.directory || '');
let savedView = null;
try { savedView = JSON.parse(sessionStorage.getItem(viewStorageKey)); } catch (_) {}
const disclosureMemory = savedView?.details && typeof savedView.details === 'object' ? savedView.details : {};
let viewScope = '';

function disclosureKey(node) {
  const section = node.closest('section.card') || document.getElementById('view');
  return JSON.stringify([viewScope, section.querySelector('h2')?.textContent || '',
    [...section.querySelectorAll('details')].indexOf(node)]);
}
function rememberDetails() {
  if (!viewScope) return;
  document.querySelectorAll('#view details').forEach(node => {
    disclosureMemory[disclosureKey(node)] = node.open;
  });
}
function restoreDetails() {
  document.querySelectorAll('#view details').forEach(node => {
    const key = disclosureKey(node);
    if (Object.prototype.hasOwnProperty.call(disclosureMemory, key)) node.open = disclosureMemory[key];
  });
}
function saveDashboardView() {
  rememberDetails();
  try {
    sessionStorage.setItem(viewStorageKey, JSON.stringify({details:disclosureMemory,
      scope:viewScope, scroll:[scrollX,scrollY]}));
  } catch (_) {} // File viewers can disable storage; in-page state still works.
}

function render() {
  hideTip();
  const t = D.tracks[state.track];
  const view = document.getElementById('view');
  rememberDetails();
  view.replaceChildren();
  if (!t) { view.append(h('p', { class: 'empty', text: 'No tracks recorded yet.' })); return; }
  const names = islandNames(t);
  if (!state.island || !names.includes(state.island)) state.island = names[0] || null;
  viewScope = JSON.stringify([t.name, state.island, state.kind]);
  view.append(h('div', { class: 'verdict ' + t.verdict.level }, h('b', { text: ({ progress: 'Making progress', early: 'Too early to tell', flat: 'No change yet', mixed: 'Mixed evidence', regress: 'Getting worse', stalled: D.meta.status === 'completed' ? 'Completed · no recent improvement' : 'No recent improvement', waiting: 'Waiting' })[t.verdict.level] || '' }), t.verdict.text));
  view.append(h('h2',{style:'font-size:15px',text:'Campaign summary — current champion'}));
  view.append(renderTiles(t));
  const coverage = chartCoverage(t);
  view.append(coverage.el);
  if (t.kind === 'tactical') view.append(chartFiring(t).el);
  view.append(chartElites(t).el);
  const search = (t.search_islands || []).map(i => i.structural_search
    ? `${i.name}: tries one change to an activation function, input or connection, then trains its weights for ${i.structural_search.every || 10} generations`
    : i.follow_champion ? `${i.name}: refines the latest champion's weights and adopts any new champion structure next generation`
    : `${i.name}: refines weights on its inherited structure`);
  if(search.length) view.append(h('p',{class:'sub',text:search.join('. ')+'.'}));
  view.append(h('p',{class:'sub',text:'Fitness rewards the configured battle or economy goals. Higher is better within the same evaluation; zero is not a pass/fail mark. Validation and holdout use different tests, so compare each with its own starting score.'}));
  const structure = chartStructure(t);
  view.append(structure.el);
  const setHash = () => { location.hash = t.name + '/' + (state.island || '') + '/' + state.kind; };
  const controls = [];
  if (names.length > 1) controls.push(h('label', { text: 'Island:' }), h('select', { 'aria-label': 'Island', onchange: e => { state.island = e.target.value; setHash(); render(); } },
    names.map(n => h('option', { value: n, text: n, selected: n === state.island }))));
  controls.push(h('label', { text: 'Candidate:' }), h('select', { 'aria-label': 'Candidate validated', onchange: e => { state.kind = e.target.value; setHash(); render(); } },
    [['center', 'island center'], ['sample', 'best sample']].map(([v, l]) => h('option', { value: v, text: l, selected: v === state.kind }))));
  controls.push(h('span', { class: 'sub', text: 'Center = current branch weights; best sample = the variation with the best training score that round. Applies to outcome, economy and stage charts below.' }));
  view.append(h('div', { class: 'row' }, controls));
  const parts = t.kind === 'tactical'
    ? [...(t.retest ? [chartRetest(t)] : []), chartFitness(t), chartOutcomes(t), chartPopulation(t), chartStages(t), chartHeat(t), chartDrift(t), chartSignal(t), chartEvents(t)]
    : [chartFitness(t), chartEconomy(t), chartPopulation(t), chartStages(t), chartHeat(t), chartDrift(t), chartSignal(t), chartEvents(t)];
  const grid = h('div', { class: 'grid' }, parts.map(p => p.el));
  view.append(grid);
  drawers = [coverage.draw, structure.draw, ...parts.map(p => p.draw)];
  drawers.forEach(d => d());
  restoreDetails();
}
function redraw() {
  rememberDetails();
  drawers.forEach(d => d());
  restoreDetails();
}

function observeDashboardWidth(main, draw) {
  let width, timer;
  new ResizeObserver(entries => {
    const nextWidth = entries[0].contentRect.width;
    if (width === undefined) { width = nextWidth; return; }
    if (Math.abs(nextWidth - width) < 0.5) return;
    width = nextWidth;
    clearTimeout(timer);
    timer = setTimeout(draw, 120);
  }).observe(main);
}

function boot() {
  const m = D.meta;
  document.getElementById('title').textContent = 'Training progress · ' + m.campaign;
  document.getElementById('subtitle').textContent = m.directory;
  const st = document.getElementById('status');
  st.textContent = m.live_seconds ? `live · refreshes every ${m.live_seconds}s` : m.status; if (m.live_seconds) st.classList.add('live');
  document.getElementById('generated').textContent = 'updated ' + m.generated_at;
  const tabs = document.getElementById('tabs');
  tabs.after(h('p',{class:'sub',text:'Each track trains a separate brain: Tactical learns combat movement and targeting; Strategic learns production and economy decisions.'}));
  D.tracks.forEach((t, i) => tabs.append(h('button', { role: 'tab', 'aria-selected': String(i === state.track), 'data-i': i,
    text: t.name[0].toUpperCase() + t.name.slice(1) + ' · ' + t.generations.length + ' gens',
    onclick: () => { state.track = i; state.island = null; location.hash = t.name; [...tabs.children].forEach((b, j) => b.setAttribute('aria-selected', String(i === j))); render(); } })));
  document.getElementById('theme').addEventListener('click', () => {
    const r = document.documentElement, cur = r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    r.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark'); redraw();
  });
  const forced = new URLSearchParams(location.search).get('theme');
  if (forced === 'light' || forced === 'dark') document.documentElement.setAttribute('data-theme', forced);
  const [tn, isl, kind] = location.hash.slice(1).split('/');
  if (kind === 'center' || kind === 'sample') state.kind = kind;
  const idx = D.tracks.findIndex(t => t.name === tn); if (idx >= 0) { state.track = idx; state.island = isl || null; [...tabs.children].forEach((b, j) => b.setAttribute('aria-selected', String(idx === j))); }
  document.getElementById('foot').textContent = 'Fitness is a weighted raw objective (higher is better). Champion and candidate validation charts use fixed tests; population and signal charts use training scores. ' + (m.fresh_screening ? `Candidates also face a rotating screen against the champion (minimum gain ${m.screen_min_gain}), then ${m.promotion_seeds} independent fresh paired batches (minimum gain ${m.min_gain}). ` : '') + 'The holdout checks performance on separate scenarios and never selects champions. Win-rate ranges are 95% Wilson intervals. Validation runs every ' + (m.validation_every || '?') + ' generation(s), so some charts have fewer points than the generation count.' + ((m.parked_tracks || []).length ? ` Paused training: ${m.parked_tracks.join(', ')}; those champion files are preserved.` : '');
  render();
  observeDashboardWidth(document.querySelector('main'), redraw);
  if (savedView?.scope === viewScope && Array.isArray(savedView.scroll)) {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    requestAnimationFrame(() => scrollTo(Number(savedView.scroll[0]) || 0, Number(savedView.scroll[1]) || 0));
  }
  window.addEventListener('pagehide', saveDashboardView);
  if (m.live_seconds) setTimeout(() => { saveDashboardView(); location.reload(); }, m.live_seconds * 1000);
}
if (D) boot(); else document.getElementById('view').textContent = 'No data embedded. Generate this page with scripts/campaign_dashboard.py.';
</script>
